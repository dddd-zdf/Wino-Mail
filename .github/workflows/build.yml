name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore tools
        run: dotnet tool restore

      # Like the local -Changed check: only XAML this branch changed, compared with main.
      - name: Check XAML formatting
        shell: pwsh
        run: |
          $base = git merge-base HEAD origin/main
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- '*.xaml')
          if ($files.Count -eq 0) { "No changed XAML files."; exit 0 }
          ./scripts/maintenance/windows/format-xaml.ps1 -Check -Path $files

      - name: Build Debug x64
        run: dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -c Debug -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      # Release gate: Native AOT, trimming and warnings-as-errors, without packaging.
      - name: Build Release x64
        run: dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:GenerateAppxPackageOnBuild=false
