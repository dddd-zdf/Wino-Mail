name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore tools
        run: dotnet tool restore

      - name: Check XAML formatting
        shell: pwsh
        run: ./scripts/maintenance/windows/format-xaml.ps1 -Check

      - name: Build Debug x64
        run: dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -c Debug -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      # Release gate: Native AOT, trimming and warnings-as-errors, without packaging.
      - name: Build Release x64
        run: dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:GenerateAppxPackageOnBuild=false

  macos:
    name: macOS (${{ matrix.rid }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # The macOS workload needs the newest Xcode on the image.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install macOS workload
        run: dotnet workload install macos

      # CI has no Apple identity, so the bundle is signed ad hoc.
      - name: Build Debug ${{ matrix.rid }}
        run: >-
          dotnet build src/Wino.Mail.MacOS/Wino.Mail.MacOS.csproj -c Debug
          -r ${{ matrix.rid }}
          -p:WinoTargetRuntimeIdentifier=${{ matrix.rid }}
          -p:WinoTargetPlatform=MacOS
          -p:EnableWindowsTargeting=true
          -p:CodesignKey=-
          -p:CodesignProvision=
